<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - Creator Hub PinFlow</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            red: '#b7001a',
                            redHover: '#e60023',
                            bg: '#050c16',
                            card: '#0b1625',
                        }
                    },
                    fontFamily: {
                        outfit: ['Outfit', 'sans-serif'],
                        inter: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 20% 30%, rgba(183, 0, 26, 0.15) 0%, transparent 40%),
                        radial-gradient(circle at 80% 70%, rgba(28, 110, 225, 0.1) 0%, transparent 45%),
                        #050c16;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .glass-card {
            background: rgba(11, 22, 37, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* Subtle glowing inputs */
        .glow-input:focus {
            box-shadow: 0 0 15px rgba(183, 0, 26, 0.25);
            border-color: rgba(183, 0, 26, 0.5);
        }

        /* Shake animation for incorrect password */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        .shake {
            animation: shake 0.5s ease-in-out;
        }
    </style>
</head>
<body class="p-4 antialiased text-slate-100">
    <div id="login-container" class="w-full max-w-[440px] transition-all duration-300">
        <!-- Logo Header -->
        <div class="mb-8 text-center">
            <div class="inline-flex items-center justify-center w-16 h-16 mb-4 rounded-2xl bg-brand-red/10 border border-brand-red/30">
                <span class="material-symbols-outlined text-brand-red text-3xl font-semibold">hub</span>
            </div>
            <h1 class="text-3xl font-extrabold tracking-tight font-outfit text-white">Creator Hub</h1>
            <p class="mt-2 text-slate-400 text-sm">Painel de Automação Visual PinFlow</p>
        </div>

        <!-- Glassmorphism Login Card -->
        <div class="glass-card rounded-3xl p-8 md:p-10 relative overflow-hidden">
            <!-- Glow background blob inside card -->
            <div class="absolute -top-12 -right-12 w-24 h-24 bg-brand-red/20 rounded-full blur-2xl pointer-events-none"></div>
            
            <h2 class="text-xl font-bold font-outfit text-white mb-6">Acesse sua conta</h2>

            <!-- Error Banner -->
            <div id="error-banner" class="hidden mb-6 p-4 rounded-xl bg-red-950/40 border border-red-500/30 text-red-200 text-sm flex items-start gap-3 transition-all duration-200">
                <span class="material-symbols-outlined text-red-400 shrink-0 select-none">error</span>
                <span id="error-message">Credenciais inválidas</span>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="space-y-5">
                <div>
                    <label for="username" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Usuário</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-xl select-none">person</span>
                        <input type="text" id="username" name="username" required autocomplete="username"
                               class="w-full bg-slate-900/60 border border-slate-700/60 rounded-xl py-3 pl-10 pr-4 text-white placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-brand-red glow-input transition-all duration-200 text-sm font-medium"
                               placeholder="Digite seu usuário">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Senha</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-xl select-none">lock</span>
                        <input type="password" id="password" name="password" required autocomplete="current-password"
                               class="w-full bg-slate-900/60 border border-slate-700/60 rounded-xl py-3 pl-10 pr-4 text-white placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-brand-red glow-input transition-all duration-200 text-sm font-medium"
                               placeholder="••••••••••••">
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="btn-submit"
                        class="w-full mt-6 bg-brand-red hover:bg-brand-redHover active:scale-[0.98] text-white py-3.5 px-4 rounded-xl font-semibold text-sm transition-all duration-200 flex items-center justify-center gap-2 group shadow-lg shadow-brand-red/10">
                    <span>Entrar no Painel</span>
                    <span class="material-symbols-outlined text-lg transition-transform group-hover:translate-x-1">arrow_forward</span>
                </button>
            </form>
        </div>

        <p class="mt-6 text-center text-xs text-slate-500">
            PinFlow v2.2.4 &copy; 2026 &bull; Todos os direitos reservados.
        </p>
    </div>

    <script>
        const form = document.getElementById('login-form');
        const submitBtn = document.getElementById('btn-submit');
        const errorBanner = document.getElementById('error-banner');
        const errorMessage = document.getElementById('error-message');
        const card = document.querySelector('.glass-card');

        // Redirect if already logged in
        fetch('check_auth.php')
            .then(res => res.json())
            .then(data => {
                if (data.logged_in) {
                    window.location.href = 'dashboard_pinautomate/code.html';
                }
            })
            .catch(() => {});

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Set loading state
            submitBtn.disabled = true;
            submitBtn.innerHTML = `
                <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span>Autenticando...</span>
            `;
            errorBanner.classList.add('hidden');
            card.classList.remove('shake');

            const formData = new FormData(form);

            try {
                const response = await fetch('login.php', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Success animation and redirect
                    submitBtn.classList.remove('bg-brand-red', 'hover:bg-brand-redHover');
                    submitBtn.classList.add('bg-emerald-600');
                    submitBtn.innerHTML = `
                        <span class="material-symbols-outlined text-xl">check_circle</span>
                        <span>Acesso Autorizado!</span>
                    `;
                    
                    setTimeout(() => {
                        window.location.href = 'dashboard_pinautomate/code.html';
                    }, 800);
                } else {
                    // Show error
                    errorMessage.textContent = data.error || 'Usuário ou senha incorretos.';
                    errorBanner.classList.remove('hidden');
                    card.classList.add('shake');
                    
                    // Reset button
                    submitBtn.disabled = false;
                    submitBtn.className = "w-full mt-6 bg-brand-red hover:bg-brand-redHover active:scale-[0.98] text-white py-3.5 px-4 rounded-xl font-semibold text-sm transition-all duration-200 flex items-center justify-center gap-2 group shadow-lg shadow-brand-red/10";
                    submitBtn.innerHTML = `
                        <span>Entrar no Painel</span>
                        <span class="material-symbols-outlined text-lg transition-transform group-hover:translate-x-1">arrow_forward</span>
                    `;
                }
            } catch (err) {
                errorMessage.textContent = 'Erro ao conectar ao servidor. Tente novamente.';
                errorBanner.classList.remove('hidden');
                card.classList.add('shake');
                
                submitBtn.disabled = false;
                submitBtn.className = "w-full mt-6 bg-brand-red hover:bg-brand-redHover active:scale-[0.98] text-white py-3.5 px-4 rounded-xl font-semibold text-sm transition-all duration-200 flex items-center justify-center gap-2 group shadow-lg shadow-brand-red/10";
                submitBtn.innerHTML = `
                    <span>Entrar no Painel</span>
                    <span class="material-symbols-outlined text-lg transition-transform group-hover:translate-x-1">arrow_forward</span>
                `;
            }
        });
    </script>
</body>
</html>
